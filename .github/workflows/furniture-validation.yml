name: Furniture foundation validation

# Validation only. No deployment, hosting credentials, provider calls or real data.
# A passing run is evidence for the checked-out SHA, not a staging approval.
on:
  push:
    branches: [arena/c3010afd-furniture-os]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: Locked native PHP and synthetic SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/furniture-platform
    env:
      APP_ENV: testing
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      APP_URL: 'http://localhost'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: curl, dom, exif, fileinfo, gd, mbstring, pdo_sqlite, sqlite3, xml, xmlwriter, zip
          tools: composer:v2
          coverage: none
      - name: Validate and install locked dependencies
        run: |
          php --version
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
          composer check-platform-reqs
      - name: Discover packages in synthetic environment
        run: php artisan package:discover --ansi
      - name: Complete current PHPUnit suite
        run: |
          set +e
          php vendor/bin/phpunit --colors=never 2>&1 | tee "$RUNNER_TEMP/phpunit-output.txt"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            details=$(tail -25 "$RUNNER_TEMP/phpunit-output.txt")
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error::$details"
          fi
          exit "$result"
      - name: Dependency advisory check
        run: |
          set +e
          composer audit --locked --format=json --no-interaction > "$RUNNER_TEMP/furniture-composer-audit.json"
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            node ../../scripts/report-composer-audit.mjs "$RUNNER_TEMP/furniture-composer-audit.json"
            exit "$result"
          fi

  mysql-roundtrip:
    name: Disposable ${{ matrix.engine }} manual SQL round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: MySQL 8.4.7
            image: mysql:8.4.7
            artifact: synthetic-mysql-8-4-7-schema
          - engine: MariaDB 10.5.29
            image: mariadb:10.5.29
            artifact: synthetic-mariadb-10-5-29-schema
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: furniture_source_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psynthetic-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: apps/furniture-platform
    env:
      APP_ENV: testing
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      APP_URL: 'http://localhost'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: furniture_source_test
      DB_USERNAME: root
      DB_PASSWORD: synthetic-ci-only
      DB_URL: ''
      MYSQL_PWD: synthetic-ci-only
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: curl, dom, exif, fileinfo, gd, mbstring, pdo_mysql, xml, xmlwriter, zip
          tools: composer:v2
          coverage: none
      - name: Install locked application dependencies and MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mysql-client
          composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
          composer check-platform-reqs
          php artisan package:discover --ansi
      - name: Migrate disposable MySQL and produce test-only SQL
        run: |
          php artisan migrate --force
          mysql -h 127.0.0.1 -u root -e 'CREATE DATABASE furniture_imported_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          # Never dump arbitrary databases or user data: this service is new and disposable.
          mysqldump -h 127.0.0.1 -u root --no-data --skip-add-drop-table --skip-triggers --skip-comments --skip-dump-date --no-tablespaces --column-statistics=0 --set-gtid-purged=OFF furniture_source_test > "$RUNNER_TEMP/furniture-test.sql"
          # Schema-only is insufficient: these tables contain migration bookkeeping and
          # essential empty-install defaults inserted by the migrations, not customer data.
          mysqldump -h 127.0.0.1 -u root --no-create-info --skip-add-locks --skip-triggers --skip-comments --skip-dump-date --no-tablespaces --column-statistics=0 --set-gtid-purged=OFF furniture_source_test migrations customer_write_guards storefront_home_content storefront_home_versions storefront_service_copy storefront_service_copy_versions >> "$RUNNER_TEMP/furniture-test.sql"
          if grep -iE '^[[:space:]]*(DROP[[:space:]]+(TABLE|DATABASE)|CREATE[[:space:]]+DATABASE|USE[[:space:]])' "$RUNNER_TEMP/furniture-test.sql"; then
            echo 'Unexpected destructive or database-selecting SQL'; exit 1
          fi
          mysql -h 127.0.0.1 -u root furniture_imported_test < "$RUNNER_TEMP/furniture-test.sql"
      - name: Compare imported schema and test the imported application
        run: |
          DB_DATABASE=furniture_imported_test php artisan migrate --force | tee "$RUNNER_TEMP/migration-after-import.txt"
          grep -q 'Nothing to migrate' "$RUNNER_TEMP/migration-after-import.txt"
          DB_DATABASE=furniture_imported_test php tests/mysql-roundtrip.php
      - name: Test an additive migration after manual SQL import
        run: |
          query="SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='furniture_imported_test' AND TABLE_NAME='leads' AND COLUMN_NAME='mysql_roundtrip_probe'"
          DB_DATABASE=furniture_imported_test php artisan migrate --path=tests/fixtures/mysql-roundtrip --force
          test "$(mysql -h 127.0.0.1 -u root -N -s -e "$query")" = 1
          DB_DATABASE=furniture_imported_test php artisan migrate:rollback --path=tests/fixtures/mysql-roundtrip --step=1 --force
          test "$(mysql -h 127.0.0.1 -u root -N -s -e "$query")" = 0
      # Preserve the exact SQL that passed import and migration tests as CI evidence.
      # This is NOT a release package: it is generated only from an empty service
      # and must not be imported into Hostinger until the application is ready.
      - name: Describe verified synthetic database artifact
        run: |
          mkdir -p "$RUNNER_TEMP/furniture-sql-evidence"
          cp "$RUNNER_TEMP/furniture-test.sql" "$RUNNER_TEMP/furniture-sql-evidence/furniture-synthetic-schema.sql"
          cd "$RUNNER_TEMP/furniture-sql-evidence"
          sha256sum furniture-synthetic-schema.sql > SHA256SUMS
          printf '%s\n' \
            'SYNTHETIC CI EVIDENCE ONLY — NOT AN INSTALLABLE RELEASE.' \
            'Do not import into Hostinger or an existing database.' \
            'Generated from an empty disposable CI database; includes migration defaults, not users or business records.' \
            "GitHub commit: $GITHUB_SHA" \
            "Database image: ${{ matrix.image }}" \
            "GitHub run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > README.txt
      - name: Upload tested synthetic SQL evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/furniture-sql-evidence/
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Locked Furniture asset build and preview tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
      - name: Furniture foundation asset build
        working-directory: apps/furniture-platform
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node --test tests/canvas-controls.test.mjs
      - name: Preview and preflight regression tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run test:preflight
          node --test scripts/report-composer-audit.test.mjs

  reimagin:
    name: Reimagin storefront bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/reimagined-storefront
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
      - name: Install locked frontend and build preview bundle
        run: |
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npx vite build
          node --test tests/service-copy-parser.test.mjs tests/city-page-parser.test.mjs tests/blog-preview-parser.test.mjs tests/preview-proxy.test.mjs tests/storefront-route-inventory.test.mjs ../../scripts/assemble-storefront-preview.test.mjs ../../scripts/storefront-route-sync.test.mjs
          node ../../scripts/assemble-storefront-preview.mjs dist "$RUNNER_TEMP/furniture-storefront-preview-files"
          test -s "$RUNNER_TEMP/furniture-storefront-preview-files/private/storefront-preview/index.html"
          test -d "$RUNNER_TEMP/furniture-storefront-preview-files/public/assets"
          test ! -e "$RUNNER_TEMP/furniture-storefront-preview-files/public/sitemap.xml"

  same-origin-smoke:
    name: Synthetic same-origin storefront and Laravel smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      APP_URL: 'http://127.0.0.1:8099'
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/furniture-smoke.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      FURNITURE_STOREFRONT_BUNDLE_ENABLED: 'true'
      FURNITURE_HOME_EDITOR_ENABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: curl, dom, exif, fileinfo, gd, mbstring, pdo_sqlite, sqlite3, xml, xmlwriter, zip
          tools: composer:v2
          coverage: none
      - name: Build and assemble the real storefront preview
        run: |
          cd apps/reimagined-storefront
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npx vite build
          node ../../scripts/assemble-storefront-preview.mjs dist "$RUNNER_TEMP/storefront-candidate"
          cd ../furniture-platform
          mkdir -p storage/app/storefront-preview
          cp "$RUNNER_TEMP/storefront-candidate/private/storefront-preview/index.html" storage/app/storefront-preview/index.html
          cp -a "$RUNNER_TEMP/storefront-candidate/public/assets" public/assets
          cp -a "$RUNNER_TEMP/storefront-candidate/public/images" public/images
          cp "$RUNNER_TEMP/storefront-candidate/public/og-cover.jpg" public/og-cover.jpg
      - name: Install application and migrate synthetic SQLite
        working-directory: apps/furniture-platform
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
          php artisan package:discover --ansi
          touch "$DB_DATABASE"
          php artisan migrate --force
      - name: Exercise same-origin routes and built assets over HTTP
        working-directory: apps/furniture-platform
        run: |
          php artisan serve --host=127.0.0.1 --port=8099 --no-reload > "$RUNNER_TEMP/furniture-smoke.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS -D "$RUNNER_TEMP/home-headers" http://127.0.0.1:8099/ -o "$RUNNER_TEMP/home.html"
          grep -qi '^X-Robots-Tag: noindex, nofollow' "$RUNNER_TEMP/home-headers"
          grep -qi 'noindex, nofollow' "$RUNNER_TEMP/home.html"
          curl -fsS http://127.0.0.1:8099/shop/example -o "$RUNNER_TEMP/nested.html"
          cmp "$RUNNER_TEMP/home.html" "$RUNNER_TEMP/nested.html"
          asset=$(grep -oE 'src="/assets/[^" ]+\.js"' "$RUNNER_TEMP/home.html" | head -1 | cut -d '"' -f 2)
          test -n "$asset"
          curl -fsS "http://127.0.0.1:8099$asset" -o "$RUNNER_TEMP/bundle.js"
          test -s "$RUNNER_TEMP/bundle.js"
          curl -fsS http://127.0.0.1:8099/storefront-api/home | grep -q 'hero_title'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/admin)" = 302
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/unknown-page)" = 404

  astro-spike:
    name: Astro shared-hero prototype
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - name: Install shared Reimagin component dependencies
        working-directory: apps/reimagined-storefront
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Build and verify isolated Astro prototype
        working-directory: apps/astro-hero-spike
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
